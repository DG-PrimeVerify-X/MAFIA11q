<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:radial-gradient(circle at top,#111 0%,#000 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:15px;
}

.card{
    width:100%;
    max-width:380px;
    background:#050505;
    border-radius:25px;
    padding:25px 20px;
    text-align:center;
    box-shadow:0 0 40px rgba(255,200,0,.25);
}

.circle{
    width:100px;
    height:100px;
    margin:0 auto 15px;
    border-radius:50%;
    border:2px solid #ffd700;
    box-shadow:0 0 20px #ffd700;
}

.title{
    font-size:22px;
    font-weight:bold;
    color:#ffd700;
    margin-bottom:10px;
}

.subtitle{
    color:#ccc;
    font-size:14px;
    margin-bottom:20px;
    line-height:1.6;
}

.features{
    text-align:left;
    color:#ddd;
    font-size:14px;
    line-height:1.8;
    margin-bottom:20px;
}

.btn{
    display:block;
    width:100%;
    padding:15px;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
    font-size:16px;
    color:#000;
    background:linear-gradient(90deg,#ffcc00,#ff9900);
    box-shadow:0 0 15px #ffcc00;
    transition:.2s;
}

.btn:hover{
    opacity:.95;
}

.btn:active{
    transform:scale(.97);
}

.note{
    margin-top:15px;
    color:#888;
    font-size:11px;
    line-height:1.5;
}
</style>

</head>

<body>

<div class="card">

    <div class="circle"></div>

    <div class="title">
        🚀 Free Telegram Community
    </div>

    <div class="subtitle">
        Join our community where people learn online skills & share useful insights.
    </div>

    <div class="features">
        ✔️ Learning content & updates<br>
        ✔️ Community discussion<br>
        ✔️ Growth ideas & tips
    </div>

    <!-- Telegram Button -->
    <a
        href="https://t.me/+DyStT_l1p8Y2YWVl"
        class="btn"
        target="_blank"
        rel="noopener"
        id="telegramButton"
    >
        🚀 Join Free Telegram Now
    </a>

    <div class="note">
        *This is for educational purposes only. No guaranteed results.
    </div>

</div>

<script>
let leadTracked = false;

document.getElementById('telegramButton').addEventListener('click', function(){

    if(leadTracked) return;

    leadTracked = true;

    if(typeof fbq === 'function'){
        fbq('track', 'Lead', {
            content_name: 'Telegram Join Button',
            value: 1,
            currency: 'INR'
        });
    }

});
</script>

</body>
</html>
